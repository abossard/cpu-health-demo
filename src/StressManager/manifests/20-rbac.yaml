apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stress-manager
  namespace: stress-manager
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["list", "create", "delete", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stress-manager
  namespace: stress-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stress-manager
subjects:
  - kind: ServiceAccount
    name: stress-manager
    namespace: stress-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stress-manager-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stress-manager-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stress-manager-nodes
subjects:
  - kind: ServiceAccount
    name: stress-manager
    namespace: stress-manager
