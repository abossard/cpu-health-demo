<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPU Stress Manager: sign in</title>
<link rel="stylesheet" href="app.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 16px; background: var(--color-bg); color: var(--color-text); }
  form { width: min(100%, 340px); display: grid; gap: 12px; padding: 24px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; }
  h1 { margin: 0; font-size: 1.25rem; }
  input { font: inherit; font-size: 1.25rem; letter-spacing: 0.15em; padding: 10px 12px; border: 1px solid var(--color-border-strong); border-radius: 8px; background: var(--color-surface-2); color: var(--color-text); }
  button { font: inherit; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--color-accent); color: var(--color-on-accent); cursor: pointer; }
  button:hover { background: var(--color-accent-hover); }
  .error { color: var(--color-unhealthy); margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>CPU Stress Manager</h1>
  <label for="code">Access code</label>
  <input id="code" name="code" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
  <input id="next" name="next" type="hidden">
  <p id="error" class="error" hidden>Wrong code.</p>
  <button type="submit">Open</button>
</form>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('next').value = q.get('next') || '/';
  if (q.has('error')) document.getElementById('error').hidden = false;
  if (q.has('limit')) { const e = document.getElementById('error'); e.textContent = 'Too many attempts. Wait a minute.'; e.hidden = false; }
</script>
</body>
</html>
